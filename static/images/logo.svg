<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Gradient สำหรับสร้างแสงเงา -->
    <radialGradient id="shadowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:currentColor;stop-opacity:0.9" />
      <stop offset="70%" style="stop-color:currentColor;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:currentColor;stop-opacity:0.2" />
    </radialGradient>
    
    <!-- Filter สำหรับ glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Filter สำหรับ inner shadow -->
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feFlood flood-color="rgba(255,255,255,0.8)"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- วงกลมวงที่ 3 (นอกสุด) - หมุน 210° -->
  <g transform="translate(200, 200) rotate(210)">
    <circle cx="0" cy="0" r="70" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="5"
            opacity="1.0"
            filter="url(#glow)"/>
    <!-- แสงเน้นด้านบน -->
    <circle cx="0" cy="-15" r="25" 
            fill="currentColor" 
            opacity="0.15"
            filter="url(#glow)"/>
  </g>
  
  <!-- วงกลมวงที่ 2 (ตรงกลาง) - หมุน 90° -->
  <g transform="translate(200, 200) rotate(90)">
    <circle cx="0" cy="0" r="55" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="6"
            opacity="0.8"
            filter="url(#glow)"/>
    <!-- แสงเน้นด้านล่างซ้าย -->
    <ellipse cx="-10" cy="10" rx="20" ry="15" 
             fill="currentColor" 
             opacity="0.2"
             filter="url(#glow)"/>
  </g>
  
  <!-- วงกลมวงที่ 1 (ในสุด) - หมุน -30° -->
  <g transform="translate(200, 200) rotate(-30)">
    <circle cx="0" cy="0" r="40" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="7"
            opacity="0.9"
            filter="url(#glow)"/>
    <!-- แสงเน้นด้านล่างขวา -->
    <ellipse cx="8" cy="8" rx="18" ry="12" 
             fill="currentColor" 
             opacity="0.25"
             filter="url(#glow)"/>
  </g>
  
  <!-- จุดกลาง -->
  <circle cx="200" cy="200" r="15" 
          fill="currentColor" 
          opacity="0.6"
          filter="url(#glow)"/>
  
  <!-- ข้อความ THE_ONE -->
  <text x="200" y="410" 
        font-family="'Kanit', 'Arial', sans-serif" 
        font-size="48" 
        font-weight="700" 
        text-anchor="middle" 
        fill="currentColor" 
        letter-spacing="8"
        opacity="0.95">THE_ONE</text>
</svg>
