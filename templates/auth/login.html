{% extends 'base.html' %}

{% block title %}เข้าสู่ระบบ - THE ONE{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div class="text-center animate-fade-in space-y-3">
            <div class="w-20 h-20 mx-auto bg-gradient-to-br from-primary-700 to-gold-500 rounded-2xl flex items-center justify-center shadow-lg">
                <i class="fas fa-motorcycle text-white text-3xl"></i>
            </div>
            <h2 class="text-3xl font-bold text-gray-900">ยินดีต้อนรับกลับ</h2>
            <p class="text-sm text-gray-600">เข้าสู่ระบบเพื่อจัดการการจองและปรึกษาช่าง</p>
        </div>
        
        <form class="section-shell p-8 space-y-6 animate-slide-up" method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-semibold text-gray-800 mb-1">ชื่อผู้ใช้</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fas fa-user"></i>
                        </div>
                        <input id="username" name="username" type="text" required 
                               class="input-field pl-10" 
                               placeholder="กรอกชื่อผู้ใช้ของคุณ">
                    </div>
                </div>
                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-800 mb-1">รหัสผ่าน</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fas fa-lock"></i>
                        </div>
                        <input id="password" name="password" type="password" required 
                               class="input-field pl-10" 
                               placeholder="กรอกรหัสผ่านของคุณ">
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="inline-flex items-center gap-2 text-gray-700">
                    <input id="remember-me" name="remember-me" type="checkbox" 
                           class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded transition-colors">
                    จดจำฉันไว้
                </label>
                <a href="#" class="font-semibold text-primary-700 hover:text-primary-900">ลืมรหัสผ่าน?</a>
            </div>

            <div>
                <button type="submit" class="w-full btn-primary justify-center">
                    เข้าสู่ระบบ
                </button>
            </div>
        </form>
        
        <p class="text-center text-sm text-gray-600 animate-fade-in" style="animation-delay: 0.2s;">
            ยังไม่มีบัญชี?
            <a href="{% url 'register' %}" class="font-semibold text-gold-700 hover:text-gold-800">
                สมัครสมาชิกใหม่
            </a>
        </p>
    </div>
</div>
{% endblock %}
